<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Apply Form</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#222}
.header{background:#fff;padding:24px 16px;text-align:center;border-bottom:1px solid #ddd}
.logo{width:70px;height:70px;border-radius:50%;margin:auto;background:#222;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold}
.header h1{margin:12px 0 4px;font-size:24px}
.header p{margin:0;color:#666}
.container{max-width:520px;margin:35px auto;padding:0 16px}
.card{background:#fff;padding:25px;border-radius:14px;box-shadow:0 3px 15px rgba(0,0,0,.08)}
label{display:block;margin:15px 0 7px;font-weight:bold}
input,textarea,select{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:16px}
textarea{min-height:100px;resize:vertical}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:8px;background:#222;color:#fff;font-size:17px;cursor:pointer}
button:hover{background:#444}
.note{text-align:center;color:#777;font-size:13px;margin-top:15px}
</style>
</head>
<body>
<div class="header">
  <div class="logo">JOB</div>
  <h1>جاب اپلائی فارم</h1>
  <p>اپنی معلومات درج کریں</p>
</div>

<div class="container">
<div class="card">
<form action="https://formsubmit.co/mnoman303ala@gmail.com" method="POST">
  <input type="hidden" name="_subject" value="نئی Job Application">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_template" value="table">

  <label>پورا نام</label>
  <input type="text" name="نام" placeholder="اپنا نام لکھیں" required>

  <label>شناختی کارڈ نمبر</label>
  <input type="text" name="شناختی_کارڈ" placeholder="مثال: 35202-1234567-1" required>

  <label>فون نمبر</label>
  <input type="tel" name="فون_نمبر" placeholder="03XX-XXXXXXX" required>

  <label>تعلیم</label>
  <input type="text" name="تعلیم" placeholder="مثال: میٹرک، ایف اے، بی اے" required>

  <label>مکمل ایڈریس</label>
  <textarea name="ایڈریس" placeholder="اپنا مکمل ایڈریس لکھیں" required></textarea>

  <button type="submit">درخواست جمع کریں</button>
</form>
<p class="note">آپ کی فراہم کردہ معلومات درخواست کے مقصد کے لیے استعمال ہوں گی۔</p>
</div>
</div>
</body>
</html>
